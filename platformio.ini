; Traffic Light Controller
;
; Two firmware targets are supported; the board is selected by the TLC_BOARD_*
; build flag, which config.h uses to pick GPIOs and the reset button:
;   esp32-c3-supermini  Teyleten Robot ESP32-C3 SuperMini (native USB-Serial/JTAG)
;   esp32-d1-mini       AITRIP/LOLIN D1 Mini ESP32 (ESP-WROOM-32, CP2104 UART)
;
; NOTE (Apple Silicon): the espressif32 platform ships precompiled IDF archives
; built with the x86_64-only gcc 8.4 toolchain, so builds run under Rosetta 2.

[platformio]
default_envs = esp32-c3-supermini

; Shared firmware settings (not inherited by the native test env).
[common]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    tzapu/WiFiManager
    esp32async/ESPAsyncWebServer
    esp32async/AsyncTCP
    bblanchon/ArduinoJson

[env:esp32-c3-supermini]
extends = common
board = esp32-c3-devkitm-1
; C3 has no USB-UART bridge; route Serial over native USB CDC.
build_flags =
    -DTLC_BOARD_C3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-d1-mini]
extends = common
board = wemos_d1_mini32
build_flags =
    -DTLC_BOARD_ESP32

; Host-native unit tests (googletest). Compiles only the hardware-independent
; units against header-only mocks in test/mock; the web/wifi/main sources that
; pull heavy libraries are excluded.
[env:native]
platform = native
test_framework = googletest
test_build_src = true
lib_deps =
    bblanchon/ArduinoJson
build_flags =
    -std=c++17
    -Iinclude
    -Itest/mock
    -DNATIVE_TEST
build_src_filter =
    -<*>
    +<LampController.cpp>
    +<StepMode.cpp>
    +<RandomMode.cpp>
    +<ModeController.cpp>
    +<Settings.cpp>
    +<SettingsCodec.cpp>
    +<WifiCodec.cpp>
    +<KnownNetworks.cpp>

