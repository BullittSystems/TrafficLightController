; Traffic Light Controller - Teyleten Robot ESP32-C3 SuperMini
; Flashing/monitoring is over the board's native USB-Serial/JTAG.

[platformio]
default_envs = esp32-c3-supermini

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; Route Serial over native USB CDC so the monitor works on the SuperMini,
; which has no separate USB-UART bridge chip.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; This framework ships precompiled IDF archives built with the x86_64-only gcc
; 8.4.0 toolchain and does not assemble/link under newer gcc. Build with the
; stock toolchain under Rosetta 2 on Apple Silicon.

lib_deps =
    tzapu/WiFiManager
    esp32async/ESPAsyncWebServer
    esp32async/AsyncTCP
    bblanchon/ArduinoJson

; Host-native unit tests (googletest). Compiles only the hardware-independent
; units against header-only mocks in test/mock; the web/wifi/main sources that
; pull heavy libraries are excluded.
[env:native]
platform = native
test_framework = googletest
test_build_src = true
lib_deps =
    bblanchon/ArduinoJson
build_flags =
    -std=c++17
    -Iinclude
    -Itest/mock
    -DNATIVE_TEST
build_src_filter =
    -<*>
    +<LampController.cpp>
    +<StepMode.cpp>
    +<RandomMode.cpp>
    +<ModeController.cpp>
    +<Settings.cpp>
    +<SettingsCodec.cpp>

