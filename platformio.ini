; Traffic Light Controller - Teyleten Robot ESP32-C3 SuperMini
; Flashing/monitoring is over the board's native USB-Serial/JTAG.

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; Route Serial over native USB CDC so the monitor works on the SuperMini,
; which has no separate USB-UART bridge chip.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; This framework ships precompiled IDF archives built with the x86_64-only gcc
; 8.4.0 toolchain and does not assemble/link under newer gcc. Build with the
; stock toolchain under Rosetta 2 on Apple Silicon.

; Dependencies are added per micro-task as they are first used:
;   task 4 (Wi-Fi provisioning): tzapu/WiFiManager
;   task 5 (web UI): esp32async/ESPAsyncWebServer + esp32async/AsyncTCP
; NOTE: ESPAsyncWebServer 3.12.1 does not compile under this toolchain's gcc 15
; (incomplete-type-in-unique_ptr). Resolve at task 5: newer lib/fork or the
; core's synchronous WebServer.

