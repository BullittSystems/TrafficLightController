name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PlatformIO and pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Pinned so CI matches a known clang-format; contributors should format with
      # a compatible version. If a newer local version disagrees cosmetically,
      # reformat with this one.
      - name: Check formatting
        run: |
          pip install "clang-format~=20.1"
          find include src test \( -name '*.h' -o -name '*.cpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      # Runs on x86_64 Linux, where the stock ESP toolchain is native (no Rosetta).
      - name: Build firmware
        run: pio run -e esp32-c3-supermini

      - name: Run unit tests
        run: pio test -e native
